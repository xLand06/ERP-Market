# =============================================================================
# CLIENT SLOT TEMPLATE — rendered by scripts/add-client.sh
#
# Do NOT edit rendered copies under deploy/clients/<slug>/ — edit this
# template instead, then re-run add-client.sh for new clients.
#
# Placeholders (${...}) are substituted by envsubst at render time with a
# fixed variable list: CLIENT_SLUG CLIENT_DOMAIN CLIENT_URL DB_NAME DB_USER
# DB_PASSWORD JWT_SECRET. Everything else is left untouched by envsubst and
# interpolated by docker compose itself ($${...} forms).
#
# Isolation model:
#   - db  : only on this client's private bridge (default network) — the
#           database is NEVER reachable from the host or from Caddy.
#   - api : on the private bridge AND on the shared external `erp_proxy`
#           network so Caddy can reach api-<slug>:3000 by DNS name.
#   - NO host ports are published for either service.
#
# pgbouncer is intentionally OUT of this template: the backend pool is
# capped at 5 connections per client, which is enough for the typical
# device fleet. See docker/pgbouncer/ for the single-tenant reference when
# a client outgrows that.
# =============================================================================

name: ${CLIENT_SLUG}

services:
  db:
    image: postgres:16-alpine
    container_name: db-${CLIENT_SLUG}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # TLS is MANDATORY here: the backend cloud client (backend/src/config/
    # prisma.ts) hardcodes ssl:{rejectUnauthorized:false} — without server TLS
    # the sync bridge cannot connect at all ("server does not support SSL").
    # A per-client self-signed keypair (`./tls/`, generated by add-client.sh)
    # is mounted read-only; the app never verifies the certificate identity,
    # so this is transport-level encryption, not a PKI.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/server.crt
      - -c
      - ssl_key_file=/run/secrets/server.key
    volumes:
      - erp-db-${CLIENT_SLUG}:/var/lib/postgresql/data
      - ./tls:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot initializes the data dir and can take longer than the probe
      # window; without start_period Compose can mark the DB unhealthy before
      # it finishes seeding, which breaks the API's service_healthy dependency.
      # PostgreSQL itself recomputes the probe from container start, so this
      # only affects the pre-seed window (harmless once ready).
      start_period: 60s
    networks:
      - default

  api:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    container_name: api-${CLIENT_SLUG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Server mode: Postgres is the authority — the backend reads/writes it
      # directly via the DEPLOY_MODE-aware prisma Proxy. No local SQLite, no
      # sync worker to itself, no /app volume persistence needed.
      DEPLOY_MODE: "server"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public&connection_limit=5
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      # CORS allowlist (backend/src/app.ts): browser access to this client's
      # URL must be permitted or the web UI is blocked cross-origin.
      FRONTEND_URL: ${CLIENT_URL}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Mirrors the health probe used by add-client.sh (GET /api/health).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - erp_proxy

networks:
  default:
  erp_proxy:
    external: true

volumes:
  erp-db-${CLIENT_SLUG}: