appId: com.allcode.allmarket
productName: ALL MARKET
copyright: Copyright © 2026 ALLCODE

protocols:
  - name: ALLMARKET
    schemes:
      - allmarket

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - node_modules/**/*
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electron-vite/**"
  - "!node_modules/ts-node/**"

# Thin client: el EXE se conecta al servidor del tenant (deep link).
# NO empaqueta el backend local — por eso el EXE es liviano (~60MB).

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: ALLCODE

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: xLand06
  repo: ERP-Market
