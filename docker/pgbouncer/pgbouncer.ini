[databases]
erp_market = host=db port=5432 dbname=erp_market user=postgres password=postgres_password

[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = stats

pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool = 5
reserve_pool_timeout = 5
max_db_connections = 50
