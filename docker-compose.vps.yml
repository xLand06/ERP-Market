version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_market}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-erp_market}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: erp_pgbouncer
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      DB_NAME: ${POSTGRES_DB:-erp_market}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_password@pgbouncer:6432/erp_market?pgbouncer=true}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres_password@db:5432/erp_market}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key}
    depends_on:
      - pgbouncer
    networks:
      - erp_net

  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - erp_net

networks:
  erp_net:
    driver: bridge

volumes:
  postgres_data:
