name: management

services:
  mgmt-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mgmt-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://mgmt:${MGMT_DB_PASSWORD}@mgmt-db:5432/mgmt
      JWT_SECRET: ${JWT_SECRET}
      DOCKER_SOCKET: /var/run/docker.sock
      DEPLOY_DIR: /repo/deploy
      HOST_DEPLOY_DIR: /opt/erp-market/deploy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/erp-market:/repo
    depends_on:
      mgmt-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - erp_proxy
      - mgmt-net

  mgmt-db:
    image: postgres:16-alpine
    container_name: mgmt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mgmt
      POSTGRES_PASSWORD: ${MGMT_DB_PASSWORD}
      POSTGRES_DB: mgmt
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
    volumes:
      - mgmt-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgmt"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mgmt-net

networks:
  erp_proxy:
    external: true
  mgmt-net:

volumes:
  mgmt-db-data:
